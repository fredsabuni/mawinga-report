// ── DESIGN CANVAS ────────────────────────────────────────────────
const DC = {
  bg:'#f0eee9', grid:'rgba(0,0,0,0.06)', label:'rgba(60,50,40,0.7)',
  title:'rgba(40,30,20,0.85)', subtitle:'rgba(60,50,40,0.6)',

};

if (!document.getElementById('dc-styles')) {

    '.dc-expand:hover{background:rgba(0,0,0,.06)}',

const DCCtx = React.createContext(null);

function DesignCanvas({ children, minScale=0.1, maxScale=8 }) {
  const [state, setState] = React.useState({ sections:{}, focus:null });
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => { setReady(true); }, []);

  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const abs = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (aid) abs.push([aid, ab]);
    });
    const srcIds = abs.map(([k]) => k);
    abs.forEach(([aid, ab]) => { registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab }; });
    sectionMeta[sid] = {
      title: (state.sections[sid]||{}).title ?? sec.props.title,
      subtitle: sec.props.subtitle, slotIds: srcIds,
    };
  });

  const api = React.useMemo(() => ({
    state, section:(id) => state.sections[id]||{},
    patchSection:(id,p) => setState(s=>({...s,sections:{...s.sections,[id]:{...s.sections[id],...(typeof p==='function'?p(s.sections[id]||{}):p)}}})),
    setFocus:(slotId) => setState(s=>({...s,focus:slotId})),
  }), [state]);

  React.useEffect(() => {
    const onKey = (e) => { if(e.key==='Escape') api.setFocus(null); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale=0.1, maxScale=8 }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const lastPostedScale = React.useRef();

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (!el) return;
    el.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
    el.style.setProperty('--dc-inv-zoom', String(1/scale));
    if (lastPostedScale.current !== scale) {
      lastPostedScale.current = scale;
      window.parent.postMessage({ type:'__dc_zoom', scale }, '*');
    }
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;
    const zoomAt = (cx,cy,factor) => {
      const r = vp.getBoundingClientRect();
      const px=cx-r.left, py=cy-r.top, t=tf.current;
      const next=Math.min(maxScale,Math.max(minScale,t.scale*factor));
      const k=next/t.scale;
      t.x=px-(px-t.x)*k; t.y=py-(py-t.y)*k; t.scale=next; apply();
    };
    const isMouseWheel = (e) => e.deltaMode!==0||(e.deltaX===0&&Number.isInteger(e.deltaY)&&Math.abs(e.deltaY)>=40);
    let isGesturing=false;
    const onWheel=(e)=>{
      e.preventDefault(); if(isGesturing) return;
      if((e.ctrlKey||e.metaKey)&&!isMouseWheel(e)) zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01));
      else if(isMouseWheel(e)) zoomAt(e.clientX,e.clientY,Math.exp(-Math.sign(e.deltaY)*0.18));
      else { tf.current.x-=e.deltaX; tf.current.y-=e.deltaY; apply(); }
    };
    const onGS=(e)=>{ e.preventDefault(); isGesturing=true; };
    const onGC=(e)=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,(tf.current.scale*e.scale)/tf.current.scale); };
    const onGE=(e)=>{ e.preventDefault(); isGesturing=false; };
    let drag=null;
    const onPD=(e)=>{ const onBg=!e.target.closest('[data-dc-slot]'); if(!(e.button===1||(e.button===0&&onBg))) return; e.preventDefault(); vp.setPointerCapture(e.pointerId); drag={id:e.pointerId,lx:e.clientX,ly:e.clientY}; vp.style.cursor='grabbing'; };
    const onPM=(e)=>{ if(!drag||e.pointerId!==drag.id) return; tf.current.x+=e.clientX-drag.lx; tf.current.y+=e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY; apply(); };
    const onPU=(e)=>{ if(!drag||e.pointerId!==drag.id) return; vp.releasePointerCapture(e.pointerId); drag=null; vp.style.cursor=''; };
    const onMsg=(e)=>{ const d=e.data; if(d&&d.type==='__dc_set_zoom') { const r=vp.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,d.scale/tf.current.scale); } else if(d&&d.type==='__dc_probe') { window.parent.postMessage({type:'__dc_present'},'*'); lastPostedScale.current=undefined; apply(); } };
    window.addEventListener('message',onMsg);
    window.parent.postMessage({type:'__dc_present'},'*'); lastPostedScale.current=undefined; apply();
    vp.addEventListener('wheel',onWheel,{passive:false});
    vp.addEventListener('gesturestart',onGS,{passive:false});
    vp.addEventListener('gesturechange',onGC,{passive:false});
    vp.addEventListener('gestureend',onGE,{passive:false});
    vp.addEventListener('pointerdown',onPD);
    vp.addEventListener('pointermove',onPM);
    vp.addEventListener('pointerup',onPU);
    vp.addEventListener('pointercancel',onPU);
    return () => {
      window.removeEventListener('message',onMsg);
      vp.removeEventListener('wheel',onWheel);
      ['gesturestart','gesturechange','gestureend'].forEach(ev=>vp.removeEventListener(ev,ev==='gesturestart'?onGS:ev==='gesturechange'?onGC:onGE));
      vp.removeEventListener('pointerdown',onPD); vp.removeEventListener('pointermove',onPM);
      vp.removeEventListener('pointerup',onPU); vp.removeEventListener('pointercancel',onPU);
    };
  }, [apply,minScale,maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{ height:'100vh', width:'100vw', background:DC.bg, overflow:'hidden', overscrollBehavior:'none', touchAction:'none', position:'relative', fontFamily:DC.font, boxSizing:'border-box' }}>
      <div ref={worldRef} style={{ position:'absolute', top:0, left:0, transformOrigin:'0 0', willChange:'transform', width:'max-content', minWidth:'100%', minHeight:'100%', padding:'60px 0 80px' }}>
        <div style={{ position:'absolute', inset:-6000, backgroundImage:gridSvg, backgroundSize:'120px 120px', pointerEvents:'none', zIndex:-1 }} />
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, subtitle, children, gap=48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const artboards = React.Children.toArray(children).filter(c => c && c.type === DCArtboard);
  const byId = Object.fromEntries(artboards.map(a => [a.props.id ?? a.props.label, a]));
  const order = artboards.map(a => a.props.id ?? a.props.label).filter(Boolean);
  return (
    <div data-dc-section={sid} style={{ marginBottom:'calc(80px * var(--dc-inv-zoom, 1))', position:'relative' }}>
      <div style={{ padding:'0 60px' }}>
        <div className="dc-sectionhead" style={{ paddingBottom:36 }}>
          <div style={{ fontSize:28, fontWeight:600, color:DC.title, letterSpacing:-0.4, marginBottom:6 }}>{title}</div>
          {subtitle && <div style={{ fontSize:16, color:DC.subtitle }}>{subtitle}</div>}

      </div>
      <div style={{ display:'flex', gap, padding:'0 60px', alignItems:'flex-start', width:'max-content' }}>
        {order.map(k => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} label={byId[k].props.label}

        ))}
      </div>
    </div>
  );
}

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n=peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const n=sectionOrder.length;
    for(let i=1;i<n;i++){
      const ns=sectionOrder[(((secIdx+d*i)%n)+n)%n];
      const first=sectionMeta[ns]&&sectionMeta[ns].slotIds[0];
      if(first){ ctx.setFocus(`${ns}/${first}`); return; }
    }
  };
  React.useEffect(() => {
    const k=(e)=>{ if(e.key==='ArrowLeft'){e.preventDefault();go(-1);} if(e.key==='ArrowRight'){e.preventDefault();go(1);} if(e.key==='ArrowUp'){e.preventDefault();goSection(-1);} if(e.key==='ArrowDown'){e.preventDefault();goSection(1);} };
    document.addEventListener('keydown',k); return()=>document.removeEventListener('keydown',k);
  });

  const { width=260, height=480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w:window.innerWidth, h:window.innerHeight });
  React.useEffect(() => { const r=()=>setVp({w:window.innerWidth,h:window.innerHeight}); window.addEventListener('resize',r); return()=>window.removeEventListener('resize',r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w-200)/width, (vp.h-260)/height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e)=>{e.stopPropagation();onClick();}}
      style={{ position:'absolute', top:'50%', [dir]:28, transform:'translateY(-50%)',
        border:'none', background:'rgba(255,255,255,.08)', color:'rgba(255,255,255,.9)',
        width:44, height:44, borderRadius:22, fontSize:18, cursor:'pointer',
        display:'flex', alignItems:'center', justifyContent:'center' }}
      onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.18)'}
      onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.08)'}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg>
    </button>
  );

  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} onWheel={e=>e.preventDefault()}
      style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(24,20,16,.6)', backdropFilter:'blur(14px)', fontFamily:DC.font, color:'#fff' }}>
      <div onClick={e=>e.stopPropagation()}
        style={{ position:'absolute', top:0, left:0, right:0, height:72, display:'flex', alignItems:'flex-start', padding:'16px 20px 0', gap:16 }}>
        <div style={{ position:'relative' }}>
          <button onClick={()=>setDd(o=>!o)}
            style={{ border:'none', background:'transparent', color:'#fff', cursor:'pointer', padding:'6px 8px', borderRadius:6, textAlign:'left', fontFamily:'inherit' }}>
            <span style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:18, fontWeight:600, letterSpacing:-0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity:.7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display:'block', fontSize:13, opacity:.6, fontWeight:400, marginTop:2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position:'absolute', top:'100%', left:0, marginTop:4, background:'#2a251f', borderRadius:8, boxShadow:'0 8px 32px rgba(0,0,0,.4)', padding:4, minWidth:200, zIndex:10 }}>
              {sectionOrder.filter(sid=>sectionMeta[sid].slotIds.length).map(sid=>(
                <button key={sid} onClick={()=>{ setDd(false); const f=sectionMeta[sid].slotIds[0]; if(f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display:'block', width:'100%', textAlign:'left', border:'none', cursor:'pointer',
                    background:sid===sectionId?'rgba(255,255,255,.1)':'transparent', color:'#fff',
                    padding:'8px 12px', borderRadius:5, fontSize:14, fontWeight:sid===sectionId?600:400, fontFamily:'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex:1 }} />
        <button onClick={()=>ctx.setFocus(null)}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.12)'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}
          style={{ border:'none', background:'transparent', color:'rgba(255,255,255,.7)', width:32, height:32, borderRadius:16, fontSize:20, cursor:'pointer', lineHeight:1 }}>×</button>
      </div>
      <div style={{ position:'absolute', top:64, bottom:56, left:100, right:100, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16 }}>
        <div onClick={e=>e.stopPropagation()} style={{ width:width*scale, height:height*scale, position:'relative' }}>
          <div style={{ width, height, transform:`scale(${scale})`, transformOrigin:'top left', background:'#fff', borderRadius:2, overflow:'hidden', boxShadow:'0 20px 80px rgba(0,0,0,.4)' }}>
            {children}
          </div>
        </div>
        <div onClick={e=>e.stopPropagation()} style={{ fontSize:14, fontWeight:500, opacity:.85, textAlign:'center' }}>
          {artboard.props.label}
          <span style={{ opacity:.5, marginLeft:10 }}>{idx+1} / {peers.length}</span>
        </div>
      </div>
      <Arrow dir="left" onClick={()=>go(-1)} />
      <Arrow dir="right" onClick={()=>go(1)} />
      <div onClick={e=>e.stopPropagation()}
        style={{ position:'absolute', bottom:20, left:'50%', transform:'translateX(-50%)', display:'flex', gap:8 }}>
        {peers.map((p,i)=>(
          <button key={p} onClick={()=>ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border:'none', padding:0, cursor:'pointer', width:6, height:6, borderRadius:3, background:i===idx?'#fff':'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}
